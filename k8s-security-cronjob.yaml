apiVersion: batch/v1
kind: CronJob
metadata:
  name: codex-security-scanner
  namespace: security-system
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: security-scanner
              image: ghcr.io/pradeeptalari14/codex-security-cloud:latest
              command: ["python3", "codex_security_scanner.py"]
              resources:
                limits:
                  memory: 2Gi
                  cpu: "2"
                requests:
                  memory: 512Mi
                  cpu: "500m"
          restartPolicy: OnFailure
